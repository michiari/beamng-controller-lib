[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamng-safe-mpd-controller"
version = "0.1.0"
description = "A BeamNG.tech vehicle controller using Safe-MPD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beamng-controllers>=0.1.0",
    "beamngpy>=1.31",
    "matplotlib>=3.7",
    "shapely>=2.0",
]

[project.scripts]
beamng-safe-mpd-controller = "safe_mpd_controller.safe_mpd_controller:main"

[tool.setuptools]
packages = ["safe_mpd_controller"]
package-dir = { safe_mpd_controller = "." }
