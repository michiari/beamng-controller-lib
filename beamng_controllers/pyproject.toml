[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamng-controllers"
version = "0.1.1"
description = "Shared modules and lightweight vehicle controllers for BeamNG.tech"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beamngpy>=1.31",
]

[project.scripts]
beamng-vehicle-controller = "beamng_controllers.vehicle_controller:main"

[tool.setuptools]
packages = ["beamng_controllers"]
package-dir = { beamng_controllers = "." }
